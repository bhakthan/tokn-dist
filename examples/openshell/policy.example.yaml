# Generated by `tokn openshell policy` (TOKN 0.3.58). Schema: NVIDIA/OpenShell@92434dc docs/how-it-works/policies/schema.mdx
# Review before use. filesystem_policy, landlock and process apply at sandbox creation only; network_policies hot-reload.
# Rules attach to a binary and are inherited by its child processes: anything allowed for tokn is reachable by tools it spawns.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: "1500"
  run_as_group: "1500"
network_policies:
  tokn_anthropic:
    name: tokn-anthropic
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/tokn
