# Generated by `tokn openshell profile --provider anthropic` (TOKN 0.3.58). Review before import.
# Import: openshell profile lint -f <file> && openshell profile import -f <file>  (import is create-only)
id: tokn-anthropic
annotations:
  tokn.dev/generator: tokn openshell profile
  tokn.dev/mirrors: anthropic
  tokn.dev/tokn-provider: anthropic
display_name: Anthropic (TOKN)
description: Model access for TOKN agents. Generated by tokn openshell; review before import.
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Anthropic (TOKN) credential
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
binaries:
  - /usr/local/bin/tokn
