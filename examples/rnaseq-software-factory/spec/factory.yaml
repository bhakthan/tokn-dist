# FactorySpec TEMPLATE for the RNA-seq (transcriptomics) Agent Factory live test.
# run.py renders every double-brace placeholder (absolute paths, model names,
# approver) and splices spec/models.<profile>.yaml in at the MODELS placeholder,
# then writes the result to <seed repo>/factory.yaml. The unrendered template
# does NOT validate (the validator rejects unresolved placeholders) - intended.
apiVersion: factory/v1
name: rnaseq-de-live
intent: |
  Keep a transcriptomics (RNA-seq) differential-expression pipeline correct on
  SYNTHETIC data: enforce the domain invariants below, turn the replayed CI failure
  and staging incidents into reviewed, tested, human-approved fixes, and leave an
  auditable evidence chain. Sample-sheet subject identifiers never reach outputs.
  When product asks, grow the single-cell prototype into a hardened annotation
  service: a LOCAL Cell2Sentence (C2S-Scale GGUF, llama.cpp llama-server) model
  proposes cell types, deterministic QC and marker verification dispose, and the
  factory tests and a human approves before anything reaches prod.
domain:
  plug: transcriptomics
  glossary: GLOSSARY.md
  invariants:
    - "counts are non-negative integers; non-integer matrices (TPM/NumReads) are rejected"
    - "samples with RIN < 6 are excluded before DE and listed in qc.json"
    - "library strandedness is inferred from sense vs opposite-strand counts, not trusted from the sample sheet"
    - "FDR uses Benjamini-Hochberg; calls need padj < 0.05 and |log2FC| >= 1"
    - "DE models batch (expression ~ condition + batch); log2FC error must keep shrinking as N grows on a partially imbalanced design (off_line_exponent <= 0.55)"
    - "Lagarias stress gate: on every stress tier (low replicates, batch imbalance, borderline RIN + mixed strandedness, high dropout) the empirical FDR stays inside the BH-implied bound; relative gap <= 0 is a counterexample and fails, gap < 0.05 is a near miss for a human"
    - "a design where condition is confounded with batch is refused (non-zero exit, no results)"
    - "subject_ref (patient-adjacent metadata) never appears in any output"
    - "data/ and golden/ are inputs and are never modified"
    - "single-cell QC (mitochondrial fraction, heterotypic doublets) runs BEFORE any model call; excluded barcodes are never sent"
    - "the C2S prompt is the model-card template over a descending-count cell sentence; no cell, sample or subject identifier is ever sent"
    - "a C2S label is accepted only if the versioned alias table maps it to the vocabulary AND marker evidence supports it; otherwise unassigned with a reason"
    - "an unreachable C2S endpoint or invalid completion fails closed: exit 4, no labels invented, nothing written"
    - "the C2S endpoint must be loopback http; cell data never leaves the host"
    - "Euler-dual check: C2S labels and marker evidence are two independent views of the same cell; disagreement on QC-passing cells (c2s_euler_discrepancy) stays <= 0.25 and every gene token on the wire is in the locked gene index"
    - "cell-type composition is reported separately from expression; within-type DE uses donor pseudobulk with BH per cell type"
  acceptance_examples: golden/de_golden.tsv
architecture:
  constraints:
    - language: "python >= 3.10"
    - allowed_deps: [numpy, pandas, scipy]
    - cli_contract: "python -m rnaseq_de.cli --counts --counts-opposite --samples --out writes de_results.tsv, qc.json, report.md"
    - cli_contract: "python -m rnaseq_de.sc_cli --sc-counts --cells --c2s-url --out [--workers] writes celltypes.tsv, sc_qc.json, composition.tsv, sc_de.tsv, sc_report.md; exit 2 bad input, 4 model unavailable"
pipeline:
  stages: [refine, design, implement, review, test, release]
  gates:
    review:
      min_reviewer_score: 0.85
      decision:
        questions:
          # Framed so "true" is the unsafe answer: a missing or vague review must not read as a pass.
          - id: invariant_broken
            type: boolean
            prompt: "According to the review, is any domain invariant broken by this change, OR is the evidence for any invariant the change touches missing (integer counts, RIN >= 6 filter, inferred strandedness, BH-FDR, batch-adjusted DE that holds on the stress ladder, confounding refusal, no subject_ref in outputs, inputs untouched; single-cell: QC before the model, no identifiers on the wire, alias + marker verification, fail closed, loopback-only endpoint, composition separate from pseudobulk DE, C2S labels that agree with marker evidence)?"
        require: { invariant_broken: "false" }
        min_confidence: 0.85
    test:
      regression_tolerance: 0
      command: '"{{PYTHON}}" -m pytest -q -p no:cacheprovider && "{{PYTHON}}" "{{GRADE_PY}}" --key "{{ANSWER_KEY}}" --requirements "{{REQUIREMENTS}}"'
      timeout: 30m
      # Near-miss bands (on_fail: needs_human below) need a named human sign-off.
      signoff: { approvers: ['{{APPROVER}}'], reason: "RH/Lagarias near-miss band" }
      # grade.py prints TOKN_METRIC lines; the grader lives outside the
      # candidate worktree, so candidate code cannot rewrite it.
      thresholds:
        - { metric: recall, op: ">=", value: 0.9 }
        - { metric: precision, op: ">=", value: 0.9 }
        - { metric: pii_clean, op: "==", value: 1 }
        - { metric: confounded_refused, op: "==", value: 1 }
        - { metric: data_intact, op: "==", value: 1 }
        # 1 until product requests the single-cell service, then every sc_* check.
        - { metric: sc_ok, op: "==", value: 1 }
        # RH-inspired stress gate (stress.py + checks/lagarias_stress_gate.py). The
        # relative gap and the scaling exponent are analogies to Lagarias's criterion
        # and an off-line zeta zero, not derived from the Riemann hypothesis.
        - { metric: lagarias_min_gap, op: ">", value: 0 }
        - { metric: lagarias_min_gap, op: ">=", value: 0.05, on_fail: needs_human }
        - { metric: off_line_exponent, op: "<=", value: 0.55 }
        - { metric: min_criterion_margin, op: ">", value: 0 }
        - { metric: min_criterion_margin, op: ">=", value: 0.05, on_fail: needs_human }
        # 0 until the single-cell service is required (same convention as sc_ok).
        - { metric: c2s_euler_discrepancy, op: "<=", value: 0.25 }
        - { metric: c2s_invalid_token_rate, op: "==", value: 0 }
    release:
      dev:
        approval: auto
        command: '"{{TOKN}}" factory demo deploy --target "{{TARGETS}}/dev"'
        reconcile_command: '"{{TOKN}}" factory demo reconcile --target "{{TARGETS}}/dev"'
      staging:
        approval: auto
        command: '"{{TOKN}}" factory demo deploy --target "{{TARGETS}}/staging"'
        reconcile_command: '"{{TOKN}}" factory demo reconcile --target "{{TARGETS}}/staging"'
      prod:
        approval: human
        approvers: ['{{APPROVER}}']
        command: '"{{TOKN}}" factory demo deploy --target "{{TARGETS}}/prod"'
        reconcile_command: '"{{TOKN}}" factory demo reconcile --target "{{TARGETS}}/prod"'
policies:
  # A full trio round (implement + review) costs ~$5; the adversarial reviewer
  # finds genuine numeric/privacy edge cases, so allow several rework rounds.
  budget: { per_run_tokens: 2000000, per_item_usd: 40, daily_usd: 150, warn_at: 0.8 }
  blast_radius:
    # Sized for the single-cell feature (sc.py ~420 + sc_cli.py ~200 + tests and
    # glossary); the incident fixes stay far below it. Bigger changes escalate.
    max_files_per_change: 12
    max_lines_per_change: 1800
    protected_paths: [data, golden]
  secrets: deny_read_outside_vault
  max_retries: 4
intake:
  sources:
    - { type: local-ci, name: replayed-ci, uri: '{{INTAKE_DIR}}/ci-replay.jsonl', options: { repo: example-lab/transcriptomics-de } }
    - { type: incidents, name: staging-incidents, uri: '{{INTAKE_DIR}}/incidents.jsonl' }
    - { type: logs, name: product-requests, uri: '{{INTAKE_DIR}}/requests.jsonl' }
{{MODELS}}
